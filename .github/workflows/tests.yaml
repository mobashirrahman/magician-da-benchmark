name: scientific-regression-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]' snakemake==9.11.2 matplotlib
      - run: pytest -q
      - run: snakemake -s workflow/Snakefile --workflow-profile profiles/testing --lint
      - run: snakemake -s workflow/Snakefile --workflow-profile profiles/testing --dry-run --cores 2
