# Configuration for using pre-simulated gastrooral CAMISIM samples
# Path to CAMISIM directory (still needed for some metadata tools)
camisim_path: /home/mrahman/magician/CAMISIM

# Conda frontend to use in Snakemake
conda_frontend: mamba

# Path to existing simulated reads and reference genomes
existing_reads_dir: /local/mrahman/magician/data/camisim_gastrooral/samples

# Sample file with metadata (use absolute path)
samples_file: /home/mrahman/magician/config/gastrooral_samples.tsv

# Read simulation parameters (kept for compatibility)
profile_type: mbarc
insert_size: 270

# Global output settings - all outputs will go to /local space
outdir: /local/mrahman/magician/results/camisim_gastrooral
dataset_id: GASTROORAL_CAMISIM 