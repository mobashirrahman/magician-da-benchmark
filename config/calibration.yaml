# Calibration overlay: every validated method on the matrix screening bundle.
# New methods are opt-in here; config/config.yaml keeps the original seven.
output_dir: results_calibration
input_mode: matrix
matrix_input:
  bundle: cache/calibration
analysis:
  methods: [wilcoxon_clr, deseq2, edger, limma_voom, aldex2, aldex2_g0, ancombc2, maaslin2,
            maaslin3_abundance, maaslin3_corrected, aldex3, aldex3_g0, adapt, rademu,
            linda, zicoseq, locom]
  metrics: [counts, relative]
  min_total_count: 10
  min_prevalence: 0.10
  enable_status: [active, planned]
experiment:
  seeds: [42]
  samples_per_group: 3
storage:
  budget_gb: 100
resources:
  threads: 4