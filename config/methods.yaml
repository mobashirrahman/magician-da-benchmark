# Differential abundance method registry.
#
# Every method the workflow can schedule is declared here once. `method_family`
# identifies the statistical model; `variant` distinguishes declared settings of
# that model (for example ALDEx2 gamma choices or a declared zero-handling
# policy). Two registry entries that share a family are never reported as
# independent methods.
#
# Fields
#   id                  selector used in analysis.methods
#   method_family       statistical model family; shared by all its variants
#   variant             declared setting label within the family
#   adapter             file stem under workflow/scripts/da/
#   environment         env stem under workflow/envs/
#   package             R package providing the test, or null for base R
#   package_version     version observed when the adapter was validated
#   accepted_inputs     matrix metrics this method may legally receive
#   transform           transform the shared contract applies before the adapter
#   zero_policy         declared entry from config/zero_handling.yaml, or none
#   truth_lane_policy   CLR geometry the endpoint is scored against; defaults to
#                       zero_policy. A package that normalizes counts internally, such
#                       as ALDEx with a non-zero gamma, declares the declared geometry
#                       that matches its own zero model.
#   endpoint            estimand the method's effect belongs to
#   hypothesis          what the test rejects, in words
#   effect_scale        units of the reported effect
#   reference           feature set the effect is expressed against
#   contrast            group contrast, always Treatment relative to Control
#   adjustment_family   multiple-testing correction the package itself applies
#   native_q            whether the package returns adjusted p-values
#   parameters          declared package settings; a settings change is a variant
#   thread_cap          maximum threads the adapter may use
#   seed                whether the adapter consumes the job seed
#   citation            primary reference
#   status              active | planned | deferred
#
# `endpoint` must match an entry in `endpoints`, and `endpoint.lane` must exist
# in src/magician/truth.py; otherwise validation fails before any job is built.
schema_version: 1
endpoints:
  relative_abundance:
    lane: relative_genomic_abundance
    description: change in length-corrected relative abundance of a source or MAG
  read_fraction:
    lane: expected_read_fraction
    description: change in expected read or DNA fraction, the scale of raw counts
  clr:
    lane: clr_log_ratio
    description: change relative to the geometric mean of the tested features
  reference_relative:
    lane: reference_relative_change
    description: change relative to a declared reference or typical feature
  absolute_abundance:
    lane: absolute_abundance
    description: change in absolute abundance per sample; requires simulated or measured load

methods:
  - id: wilcoxon_clr
    method_family: clr_wilcoxon
    variant: pseudocount_measurement
    adapter: wilcoxon_clr
    environment: r_core
    package: null
    package_version: null
    accepted_inputs: [counts, tpm, rpkm, relative]
    transform: clr
    zero_policy: pseudocount_measurement
    endpoint: clr
    hypothesis: the two groups differ in expected log2 centred log-ratio of the tested features
    effect_scale: log2_clr
    reference: geometric_mean_of_tested_features
    contrast: Treatment / Control
    adjustment_family: BH
    native_q: false
    parameters: {}
    thread_cap: 1
    seed: false
    citation: "Benjamini and Hochberg (1995) controlling the FDR; base R stats::wilcox.test"
    status: active

