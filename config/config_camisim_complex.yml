# ------------------------------------------------------
# Sample-design specification for CAMISIM
# ------------------------------------------------------
seed: 42

reference_dir: "/home/mrahman/magician/data/camisim_toy"      # folder full of genome FASTAs
output_dir:   "/home/mrahman/magician/data/camisim_complex"

groups:                       # <name>: <number of samples>
  Control: 10
  Treatment: 10

abundance_prior:              # baseline weights per genome
  distribution: lognormal
  mu: -1.0                    # ln-space mean
  sigma: 1.2

differential_abundance:       # DA settings
  n_da: 10
  effect_sizes: [0.25, 0.5, 2, 4, 8]

library_depth:                # reads per sample
  distribution: lognormal
  mu: 16                      # ln-space mean ≈ 9.0 M reads
  sigma: 0.7
