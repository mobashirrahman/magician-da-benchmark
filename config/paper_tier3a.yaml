# Paper Tier 3a overlay: real-null bundle (200 label splits, any discovery false).
# Built by tools/paper_tier3a.py from real assembly counts; this config consumes it.
# Single command: python run_magician.py --configfile config/paper_tier3a.yaml --cores 60
output_dir: results_paper_tier3a
input_mode: matrix
matrix_input:
  bundle: cache/paper_tier3a
analysis:
  method_registry: config/methods.yaml
  methods: [wilcoxon_clr, deseq2, edger, limma_voom, aldex2, aldex2_g0, ancombc2, maaslin2,
            maaslin3_abundance, maaslin3_corrected, aldex3, aldex3_g0, adapt, rademu,
            linda, zicoseq, ttest_relative, wilcoxon_relative, random_score]
  metrics: [counts, relative]
  min_total_count: 10
  min_prevalence: 0.10
  enable_status: [active]
  truth_reference: median_feature
experiment:
  seeds: [42]
  samples_per_group: 3
storage:
  budget_gb: 100
resources:
  threads: 4
