name: bambi_env
channels:
  - conda-forge
  - bioconda
dependencies:
  ## R stack
  - r-base=4.3        # R ≥ 4.0 required by BAMBI :contentReference[oaicite:0]{index=0}
  - r-devtools        # installs GitHub pkgs
  - r-renv            # project-local library bootstrap
  - r-batchtools      # BAMBI uses it for parallel runs
  - r-data.table
  - r-tidyverse
  ## system helpers
  - pandoc            # vignette / markdown rendering
  - git
  - make
  - gcc_linux-64      # C toolchain for package compilation
  - gxx_linux-64
